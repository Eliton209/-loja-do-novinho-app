<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#12315a">
  <title>Garimpador antigo desativado | Loja do Novinho</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f6fb;color:#18304f;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,520px);padding:32px;border:1px solid #dce5f0;border-radius:18px;background:#fff;box-shadow:0 16px 48px #16345b12;text-align:center}
    .mark{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:15px;background:#12315a;color:#fff;font-weight:800;letter-spacing:-1px}
    h1{font-size:24px;margin:20px 0 10px}
    p{line-height:1.65;color:#5d6e84;margin:0}
    .note{margin-top:22px;padding:13px;border-radius:10px;background:#eef4fc;color:#234b7b;font-size:14px}
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">LDN</span>
    <h1>Este Garimpador antigo foi desativado</h1>
    <p>Esta página não oferece mais instalação nem acesso ao aplicativo antigo.</p>
    <div class="note">A Loja do Novinho e o novo Garimpador independente continuam separados e não foram alterados.</div>
  </main>
</body>
</html>
